# EXAMPLE ONLY. Put real values in Streamlit's private Secrets editor or secrets.toml.
GEMINI_API_KEY = "replace-privately"
GEMINI_MODEL = "gemini-3.1-flash-lite"
# Copy Connect > Session pooler (port 5432). Percent-encode the database password.
DATABASE_URL = "postgresql://postgres.PROJECT_REF:PASSWORD@POOLER_HOST:5432/postgres"
SUPABASE_PROJECT_REF = "replace-with-project-ref"
# Management API token, NOT the public anon key or service_role key.
SUPABASE_MANAGEMENT_TOKEN = "replace-privately"
# Use your existing private admin code or a new random code with 24+ characters.
ADMIN_ACCESS_CODE = "replace-with-a-long-private-admin-code"
